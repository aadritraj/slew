<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>slew</title>
    <style>
        :root {
            --bg: #fafafa;
            --text: #18181b;
            --muted: #71717a;
            --border: #e4e4e7;
            --code-bg: #f4f4f5;
            --accent: #2563eb;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #09090b;
                --text: #f4f4f5;
                --muted: #a1a1aa;
                --border: #27272a;
                --code-bg: #18181b;
                --accent: #60a5fa;
            }
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 14px;
            line-height: 1.6;
            padding: 4rem 1.5rem;
            display: flex;
            justify-content: center;
        }
        main {
            width: 100%;
            max-width: 520px;
        }
        header {
            margin-bottom: 2rem;
        }
        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            margin-bottom: 0.25rem;
        }
        p.lead {
            color: var(--muted);
        }
        section {
            border-top: 1px solid var(--border);
            padding: 1.5rem 0;
        }
        h2 {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--muted);
            margin-bottom: 1rem;
        }
        ul {
            list-style: none;
        }
        li {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            padding: 0.35rem 0;
            font-size: 0.9rem;
        }
        .endpoint {
            display: flex;
            align-items: baseline;
            gap: 0.75rem;
        }
        .method {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.75rem;
            color: var(--muted);
            width: 2.5rem;
        }
        a,
        .endpoint span:not(.method) {
            color: var(--text);
            text-decoration: none;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.85rem;
        }
        a:hover {
            text-decoration: underline;
            color: var(--accent);
        }
        .meta {
            color: var(--muted);
            font-size: 0.85rem;
        }
        dl {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 0.4rem 1.5rem;
            font-size: 0.85rem;
        }
        dt {
            color: var(--muted);
        }
        dd {
            color: var(--text);
        }
    </style>
</head>
<body>
    <main>
        <header>
            <h1>slew</h1>
            <p class="lead">slew Web Server on Linux io_uring and C++20.</p>
        </header>

        <section>
            <h2>Endpoints</h2>
            <ul>
                <li>
                    <div class="endpoint">
                        <span class="method">GET</span>
                        <a href="/health">/health</a>
                    </div>
                    <span class="meta">Server health check</span>
                </li>
                <li>
                    <div class="endpoint">
                        <span class="method">GET</span>
                        <a href="/hello">/hello</a>
                    </div>
                    <span class="meta">Plaintext greeting</span>
                </li>
                <li>
                    <div class="endpoint">
                        <span class="method">POST</span>
                        <span>/api/echo</span>
                    </div>
                    <span class="meta">Request body echo</span>
                </li>
            </ul>
        </section>

        <section>
            <h2>System</h2>
            <dl>
                <dt>Kernel interface</dt>
                <dd>Raw io_uring syscalls</dd>
                <dt>Concurrency</dt>
                <dd>Shared-nothing thread-per-core</dd>
                <dt>Protocol</dt>
                <dd>HTTP/1.1</dd>
            </dl>
        </section>
    </main>
</body>
</html>
